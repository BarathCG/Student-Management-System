<div class="container">

<h2 class="title">Student List</h2>

<table class="student-table">

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Course</th>
<th>Phone</th>
</tr>
</thead>

<tbody>

<tr *ngFor="let s of students">
<td>{{s.id}}</td>
<td>{{s.name}}</td>
<td>{{s.email}}</td>
<td>{{s.course}}</td>
<td>{{s.phone}}</td>
</tr>

</tbody>

</table>

</div>
